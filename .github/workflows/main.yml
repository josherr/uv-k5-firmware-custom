on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    container:
      image: archlinux:latest
    steps:
      - name: base-devel
        run:  pacman -Syyu base-devel --noconfirm
      - name: arm-none-eabi-gcc
        run:  pacman -Syyu arm-none-eabi-gcc --noconfirm
      - name: arm-none-eabi-newlib
        run:  pacman -Syyu arm-none-eabi-newlib --noconfirm
      - name: git
        run:  pacman -Syyu git --noconfirm
      - name: python-pip
        run:  pacman -Syyu python-pip --noconfirm
      - name: python-crcmod
        run:  pacman -Syyu python-crcmod --noconfirm      

      - name: Checkout
        uses: actions/checkout@v4

      - name: safe.directory
        run:  git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Make
        run:  make FRS_APPLIANCE_BUILD=1
      - name: size
        run:  arm-none-eabi-size firmware_frs

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: firmware_frs
          path: firmware_frs*.bin

      - name: Upload binaries to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: firmware_frs.packed.bin
          asset_name: firmware_frs_$tag.packed.bin
          tag: ${{ github.ref }}
          overwrite: true
          release_name: release ${{ github.ref_name }}

      - name: Publish latest pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (FRS Appliance Mode)
          prerelease: true
          make_latest: false
          files: firmware_frs*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
